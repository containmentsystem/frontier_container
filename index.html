<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>installations</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ccircle cx='8' cy='8' r='5' fill='none' stroke='%2300ff00' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:#000;
    font-family:Helvetica,"Helvetica Neue",Arial,sans-serif;
    text-transform:lowercase;-webkit-text-size-adjust:100%}
  body{display:flex;align-items:center;justify-content:center;gap:12vw;
    flex-wrap:wrap;padding:8vw 6vw}

  a{display:flex;flex-direction:column;align-items:center;gap:22px;
    text-decoration:none;opacity:.72;transition:opacity .45s ease}
  a:hover,a:focus-visible{opacity:1;outline:none}

  svg{display:block;width:min(30vw,230px);height:min(30vw,230px);
    transform-origin:50% 50%}
  .green svg{animation:spin 34s linear infinite}
  .white svg{animation:spin 34s linear infinite reverse}

  circle{fill:none;stroke-width:1.25;vector-effect:non-scaling-stroke}
  .green circle{stroke:#00ff00;stroke-dasharray:215.327 36}
  .white circle{stroke:#fff;stroke-dasharray:101.664 24}

  span{font-size:12px;letter-spacing:.16em;color:#555;
    transition:color .45s ease}
  .green:hover span,.green:focus-visible span{color:#00ff00}
  .white:hover span,.white:focus-visible span{color:#fff}

  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){svg{animation:none}}
  @media (max-width:620px){body{gap:16vw}}
</style>
</head>
<body>

<a class="green" href="collage.html">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40"/></svg>
  <span>screen collage</span>
</a>

<a class="white" href="array.html">
  <svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="40"/></svg>
  <span>portable array</span>
</a>

</body>
</html>
